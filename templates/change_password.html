{% extends "base.html" %}

{% block content %}

<div class="landing">
<div class="landing-card" style="max-width:380px;">

    <span class="landing-emoji" style="font-size:48px;">🔑</span>
    <h1 style="font-size:22px; font-weight:700; color:var(--text-primary); margin-bottom:4px;">Change password</h1>
    <p class="landing-tagline" style="margin-bottom:24px;">You will log in again afterwards</p>

    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}" style="text-align:left;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autofocus autocomplete="current-password">

        <label for="new_password">New password (8 or more characters)</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">

        <label for="new_password_again">New password again</label>
        <input type="password" id="new_password_again" name="new_password_again" required minlength="8" autocomplete="new-password">

        <button type="submit" class="btn">Change password</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('dashboard') }}">Cancel and go back</a></p>

</div>
</div>

{% endblock %}
