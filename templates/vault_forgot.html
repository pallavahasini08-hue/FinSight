{% extends "base.html" %}

{% block content %}

<div class="toolkit-bg">
<div style="min-height:calc(100vh - 92px); display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="background:var(--bg-card); border-radius:12px; box-shadow:var(--shadow); width:100%; max-width:380px; padding:28px;">

        <h1 style="font-size:19px; font-weight:700; color:var(--text-primary); margin-bottom:6px; text-align:center;">Reset your vault PIN</h1>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:18px; text-align:center;">Type your FinSight account password, then choose a new PIN. Your documents are not touched.</p>

        {% if error %}
        <p class="auth-error" style="margin:0 0 14px;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('vault_forgot') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password" style="display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text-secondary);">Account password</label>
            <input type="password" id="password" name="password" required autofocus
                style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg-input); color:var(--text-primary); margin-bottom:12px;">

            <label for="pin" style="display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text-secondary);">New PIN (4 to 6 digits)</label>
            <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" minlength="4" autocomplete="off" required
                style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg-input); color:var(--text-primary); margin-bottom:12px;">

            <label for="pin_again" style="display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text-secondary);">New PIN again</label>
            <input type="password" id="pin_again" name="pin_again" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" minlength="4" autocomplete="off" required
                style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg-input); color:var(--text-primary); margin-bottom:16px;">

            <button type="submit" class="btn" style="width:100%; padding:9px; font-size:13px;">Reset PIN and open vault</button>
        </form>
        <a href="{{ url_for('vault_unlock') }}" style="display:block; text-align:center; margin-top:12px; font-size:12px; color:var(--text-secondary); text-decoration:none;">Cancel and go back</a>

    </div>
</div>
</div>

{% endblock %}
